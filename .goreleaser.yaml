version: 2

project_name: ynab

builds:
  - id: ynab
    main: .
    binary: ynab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      # Match the v-prefixed identity that the build task derives on a version tag.
      - -s -w -X github.com/jmcampanini/ynab-cli/internal/cli.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github-native

release:
  github:
    owner: jmcampanini
    name: ynab-cli
  draft: false
  prerelease: auto
